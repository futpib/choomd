[package]
name = "choomd"
version = "1.0.1"
authors = ["futpib"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.47", features = [ "std", "derive", "help" ], default-features = false }
env_logger = { version = "0.11.8", default-features = false }
glob = { version = "0.3.3", default-features = false }
humantime = { version = "2.3.0", default-features = false }
log = { version = "0.4.28", default-features = false }
procfs = { version = "0.18.0", default-features = false }
toml = { version = "0.9.5", features = [ "parse", "preserve_order", "serde" ], default-features = false }
users = { version = "0.11.0", default-features = false }
